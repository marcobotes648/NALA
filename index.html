<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NALA — Stay · Book · Experience — NALA FULL V1</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#101828}
header{background:#071426;color:#fff;padding:16px}.wrap{max-width:1100px;margin:auto;padding:16px}
.logo{font-size:30px;font-weight:900;letter-spacing:6px}.sub{font-size:11px;color:#cbd5e1}
.notice{padding:12px;border-radius:10px;margin-bottom:16px;background:#fff3cd}.ok{background:#e9f9ef}.err{background:#fdecec}
.search{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select,textarea{padding:12px;border:1px solid #d0d5dd;border-radius:9px;box-sizing:border-box;width:100%}
button{padding:11px 15px;border:0;border-radius:9px;background:#071426;color:#fff;font-weight:bold;cursor:pointer}
button.gold{background:#cda64e;color:#111}button.danger{background:#b42318}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px}.price{font-size:20px;font-weight:900}.muted{color:#667085;font-size:13px}
nav{display:flex;gap:5px;margin-top:12px;overflow:auto}nav button{background:#18283d;color:#ddd;white-space:nowrap}nav button.active{background:#cda64e;color:#111}
.hidden{display:none}table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}
.account{max-width:520px;margin:20px auto}.userbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef4ff;font-size:12px}.stat{font-size:25px;font-weight:900}
</style></head>
<body>
<header><div class="wrap"><div class="logo">NALA</div><div class="sub">STAY · BOOK · EXPERIENCE</div>
<div id="accountBar" style="margin-top:10px"></div><div id="dashBar" style="margin-top:8px"></div>
<nav id="nav"><button class="active" onclick="page('home',this)">Explore</button><button onclick="page('bookings',this)">My Bookings</button><button onclick="page('partner',this)">Partner</button><button onclick="page('admin',this)">Admin</button><button onclick="page('ai',this)">NALA AI</button></nav></div></header>
<div class="wrap">
<div id="status" class="notice">Connecting to NALA...</div>


<section id="dashboard" class="hidden">
  <div class="card">
    <h2>NALA Dashboard</h2>
    <p id="dashRole" class="muted"></p>
    <div id="dashContent"></div>
  </div>
</section>

<section id="account" class="hidden"><div class="card account"><h2>NALA Account</h2><div id="authForm"></div></div></section>

<section id="home"><h1>Find your stay</h1><div class="search"><input id="search" placeholder="Search city or property"><button onclick="loadProperties()">Search</button></div><div id="cards" class="grid"></div></section>

<section id="bookings" class="hidden"><h1>My Bookings</h1><div id="bookingList"></div></section>

<section id="partner" class="hidden"><h1>Partner Dashboard</h1><div id="partnerGate"></div><div id="partnerContent" class="hidden">
<div class="card"><h2>Register a property</h2><div class="row"><input id="pn" placeholder="Property name"><input id="pc" placeholder="City"><input id="pa" placeholder="Address"><input id="pphone" placeholder="Property phone"><input id="pr" type="number" placeholder="Nightly rate (ZAR)"><input id="prooms" type="number" placeholder="Room inventory" value="1"></div><p><textarea id="pdesc" placeholder="Property description"></textarea></p><button onclick="registerPartner()">Submit for approval</button></div>
<div class="card" style="margin-top:14px"><h2>My properties</h2><div id="myProperties"></div></div>
<div class="card" style="margin-top:14px"><h2>My bookings</h2><div id="partnerBookings"></div></div></div></section>

<section id="admin" class="hidden"><h1>NALA Admin</h1><div id="adminGate"></div><div id="adminContent" class="hidden">
<div id="adminStats" class="grid"></div>
<div class="card" style="margin-top:14px"><h2>Properties</h2><div id="adminProperties"></div></div>
<div class="card" style="margin-top:14px"><h2>Bookings & NALA commission</h2><div id="adminBookings"></div></div></div></section>

<section id="ai" class="hidden"><h1>NALA AI Operations</h1><div id="aiGate"></div><div id="aiContent" class="hidden"><div id="aiStats" class="card"></div><h2>Decision queue</h2><div id="tasks"></div></div></section>
</div>

<script>
const SUPABASE_URL="https://pvkdgkvxzvxdaggugipx.supabase.co";
const SUPABASE_KEY="sb_publishable_Ikq79CsbvfQmcIxdemIX_g_guw9VXC1";
const HOSTED_URL="https://marcobotes648.github.io/NALA/";
// NALA V1 admin account for this deployment. Authentication is still required.
const ADMIN_EMAIL="marcobotes648@gmail.com";
let currentUser=null,currentProfile=null,properties=[],bookings=[],tasks=[],settings={commission_rate:15};

async function api(path,options={}){
 let token=localStorage.getItem("nala_access_token");
 let r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...options,headers:{
  "apikey":SUPABASE_KEY,"Authorization":"Bearer "+(token||SUPABASE_KEY),
  "Content-Type":"application/json",...(options.headers||{})
 }});
 if(r.status===401 && await refreshSession()){
  token=localStorage.getItem("nala_access_token");
  r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...options,headers:{
   "apikey":SUPABASE_KEY,"Authorization":"Bearer "+token,
   "Content-Type":"application/json",...(options.headers||{})
  }});
 }
 const t=await r.text();if(!r.ok)throw new Error(r.status+" "+t);return t?JSON.parse(t):[];
}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function status(msg,ok=false){const e=document.getElementById("status");e.textContent=msg;e.className="notice "+(ok?"ok":"err")}
function isAdmin(){return currentProfile?.role==="admin"} function isPartner(){return currentProfile?.role==="partner"||isAdmin()}

function acceptRedirect(){
 const hash=location.hash?.substring(1)||"",p=new URLSearchParams(hash),a=p.get("access_token"),r=p.get("refresh_token");
 if(a){localStorage.setItem("nala_access_token",a);if(r)localStorage.setItem("nala_refresh_token",r);history.replaceState({},document.title,location.pathname+location.search)}
}
acceptRedirect();

async function refreshSession(){
 const refresh=localStorage.getItem("nala_refresh_token");
 if(!refresh)return false;
 try{
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:refresh})});
  const d=await r.json();
  if(!r.ok||!d.access_token) return false;
  localStorage.setItem("nala_access_token",d.access_token);
  if(d.refresh_token)localStorage.setItem("nala_refresh_token",d.refresh_token);
  return true;
 }catch(e){return false}
}
async function getProfileForUser(user){
 const id=encodeURIComponent(user.id);
 const queries=[
  "nala_profiles?select=*&id=eq."+id+"&limit=1",
  "nala_profiles?select=*&user_id=eq."+id+"&limit=1",
  "nala_nala_profiles?select=*&id=eq."+id+"&limit=1",
  "nala_nala_profiles?select=*&user_id=eq."+id+"&limit=1",
  "profiles?select=*&id=eq."+id+"&limit=1",
  "profiles?select=*&user_id=eq."+id+"&limit=1"
 ];
 for(const q of queries){try{const rows=await api(q);if(rows&&rows[0])return rows[0]}catch(e){}}
 const metadataRole=user.app_metadata?.role||user.user_metadata?.role;
 if(metadataRole)return {role:metadataRole,full_name:user.user_metadata?.full_name||""};
 if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase())return {role:"admin",full_name:user.user_metadata?.full_name||""};
 return null;
}
async function refreshUser(){
 currentUser=null;currentProfile=null;let token=localStorage.getItem("nala_access_token");
 if(!token){renderAccount();renderNav();return}
 try{
  let r=await fetch(SUPABASE_URL+"/auth/v1/user",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+token}});
  if(r.status===401 && await refreshSession()){
   token=localStorage.getItem("nala_access_token");
   r=await fetch(SUPABASE_URL+"/auth/v1/user",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+token}});
  }
  if(!r.ok)throw new Error("Session expired");
  currentUser=await r.json();
  currentProfile=await getProfileForUser(currentUser);
 }catch(e){
  localStorage.removeItem("nala_access_token");localStorage.removeItem("nala_refresh_token");currentUser=null;currentProfile=null;
 }
 renderAccount();renderNav();
}
function renderAccount(){
 const e=document.getElementById("accountBar");if(!e)return;
 e.innerHTML=currentUser?`<div class="userbar"><span>Signed in: <b>${esc(currentUser.email)}</b> <span class="pill">${esc(currentProfile?.role||"guest")}</span></span><button onclick="logout()">Logout</button></div>`:`<div class="userbar"><span class="muted">Not signed in</span><button onclick="openAccount()">Login / Sign up</button></div>`;
}
function openAccount(){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));document.getElementById("account").classList.remove("hidden");showAuth("login")}
function showAuth(m){
 document.getElementById("authForm").innerHTML=m==="signup"?`<p class="muted">Create a free NALA account.</p><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password (6+ characters)"><button onclick="signup()">Create account</button><p><button onclick="showAuth('login')">Back to login</button></p>`:`<p class="muted">Sign in to NALA.</p><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password"><button onclick="login()">Login</button><p><button onclick="showAuth('signup')">Create account</button></p>`;
}
async function login(){
 const email=authEmail.value.trim(),password=authPassword.value;if(!email||!password)return alert("Enter email and password.");
 try{const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||"Login failed");localStorage.setItem("nala_access_token",d.access_token);if(d.refresh_token)localStorage.setItem("nala_refresh_token",d.refresh_token);await refreshUser();page("home",document.querySelector("nav button"));}catch(e){alert(e.message)}
}
async function signup(){
 const email=authEmail.value.trim(),password=authPassword.value;if(!email||password.length<6)return alert("Use an email and password of at least 6 characters.");
 try{const r=await fetch(SUPABASE_URL+"/auth/v1/signup?redirect_to="+encodeURIComponent(HOSTED_URL),{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||"Signup failed");if(d.access_token)localStorage.setItem("nala_access_token",d.access_token);if(d.refresh_token)localStorage.setItem("nala_refresh_token",d.refresh_token);await refreshUser();alert(d.access_token?"Account created.":"Check your email to confirm your account.");}catch(e){alert(e.message)}
}
async function logout(){const t=localStorage.getItem("nala_access_token");try{if(t)await fetch(SUPABASE_URL+"/auth/v1/logout",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+t}})}catch(e){}localStorage.removeItem("nala_access_token");localStorage.removeItem("nala_refresh_token");currentUser=null;currentProfile=null;renderAccount();page("home",document.querySelector("nav button"))}

async function start(){
 try{await api("properties?select=id&limit=1");status("✓ NALA is connected to Supabase.",true);await loadSettings();await loadProperties()}catch(e){status("NALA could not reach the database: "+e.message)}
 renderNav();
}
async function loadSettings(){try{const x=await api("nala_settings?select=*&id=eq.true&limit=1");if(x[0])settings=x[0]}catch(e){}}

async function loadProperties(){
 try{properties=await api("properties?select=*&active=eq.true&approval_status=eq.approved&order=name");const q=(search.value||"").toLowerCase();const list=properties.filter(p=>(p.name+" "+p.city).toLowerCase().includes(q));cards.innerHTML=list.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.city)} · ${esc(p.type||"Stay")}</div><p>${esc(p.description||p.amenities||"Wi-Fi")}</p><p><b class="price">R${Number(p.price||0).toFixed(2)}</b> / night</p><button class="gold" onclick="book('${p.id}')">Book</button></div>`).join("")||"<div class='card'>No stays found.</div>"}catch(e){status("Connected, but properties could not load: "+e.message)}
}

async function book(propertyId){
 if(!currentUser){openAccount();return}
 const p=properties.find(x=>x.id===propertyId);if(!p)return;
 const rooms=await api("rooms?select=*&property_id=eq."+propertyId+"&active=eq.true&order=price");
 if(!rooms.length){alert("This property has no bookable rooms yet.");return}
 const room=rooms[0],name=prompt("Guest name?",currentProfile?.full_name||"");if(!name)return;
 const date=prompt("Check-in date (YYYY-MM-DD)?");if(!date)return;
 const nights=Math.max(1,Number(prompt("Number of nights?","1")||1)),guests=Math.max(1,Number(prompt("Number of guests?","1")||1));
 const total=Number(room.price)*nights;
 try{
  const data=await api("bookings",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({property_id:propertyId,room_id:room.id,guest_id:currentUser.id,guest_name:name,guest_email:currentUser.email,check_in:date,nights,guests,total_amount:total,status:"confirmed"})});
  alert("Booking confirmed: "+data[0].booking_ref);await loadBookings();
 }catch(e){alert("Booking failed: "+e.message)}
}

async function loadBookings(){
 if(!currentUser){bookingList.innerHTML="<div class='card'>Log in to see your bookings.</div>";return}
 try{bookings=await api("bookings?select=*,properties(name,city),rooms(name)&guest_id=eq."+currentUser.id+"&order=created_at.desc");bookingList.innerHTML=bookings.length?bookings.map(b=>`<div class="card" style="margin:10px 0"><b>${esc(b.properties?.name||"Property")}</b><div class="muted">${esc(b.booking_ref)} · ${esc(b.check_in)} · ${b.nights} night(s)</div><p>${esc(b.rooms?.name||"Room")} · R${Number(b.total_amount||0).toFixed(2)} · <span class="pill">${esc(b.status)}</span></p></div>`).join(""):"<div class='card'>No bookings yet.</div>"}catch(e){bookingList.innerHTML="<div class='card'>"+esc(e.message)+"</div>"}
}

function renderNav(){
 const partner=document.querySelector('nav button:nth-child(3)'),admin=document.querySelector('nav button:nth-child(4)'),ai=document.querySelector('nav button:nth-child(5)');
 partner.classList.toggle("hidden",!isPartner());admin.classList.toggle("hidden",!isAdmin());ai.classList.toggle("hidden",!isAdmin());
}
async function page(id,btn){
 if(id==="partner"&&!isPartner()){openAccount();alert("Partner access requires a partner account.");return}
 if((id==="admin"||id==="ai")&&!isAdmin()){openAccount();alert("Admin access only.");return}
 document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");
 if(id==="bookings")loadBookings();if(id==="partner")loadPartner();if(id==="admin")loadAdmin();if(id==="ai")loadAI();
}

async function registerPartner(){
 if(!currentUser)return openAccount();
 const name=pn.value.trim(),city=pc.value.trim(),price=Number(pr.value||0),roomsCount=Math.max(1,Number(prooms.value||1));
 if(!name||!city||!price)return alert("Enter property name, city and nightly rate.");
 try{
  const d=await api("properties",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({name,city,price,rooms:roomsCount,type:"Guesthouse",amenities:"Wi-Fi",active:false,approval_status:"pending",owner_id:currentUser.id,owner_name:currentProfile?.full_name||"",owner_email:currentUser.email,address:pa.value,phone:pphone.value,description:pdesc.value,commission_rate:Number(settings.commission_rate||15)})});
  const prop=d[0];await api("rooms",{method:"POST",body:JSON.stringify({property_id:prop.id,name:"Standard Room",description:"Standard room",max_guests:2,price,inventory:roomsCount,active:true})});
  alert("Submitted. NALA will keep it offline until an admin approves it.");await loadPartner();
 }catch(e){alert("Could not submit property: "+e.message)}
}
async function loadPartner(){
 if(!isPartner())return;partnerContent.classList.remove("hidden");partnerGate.innerHTML="";
 const all=await api("properties?select=*&owner_id=eq."+currentUser.id+"&order=created_at.desc");
 myProperties.innerHTML=all.length?all.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.name)}</b><div class="muted">${esc(x.city)} · R${Number(x.price).toFixed(2)} · ${esc(x.approval_status)}</div><p>${esc(x.description||"")}</p></div>`).join(""):"No properties yet.";
 const bs=await api("bookings?select=*,properties(name,city),rooms(name)&order=created_at.desc");const mine=bs.filter(b=>all.some(p=>p.id===b.property_id));
 partnerBookings.innerHTML=mine.length?mine.map(b=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${esc(b.properties?.name)}</b> · ${esc(b.booking_ref)} · R${Number(b.total_amount).toFixed(2)} · NALA R${Number(b.commission_amount).toFixed(2)}</div>`).join(""):"No bookings yet.";
}

async function loadAdmin(){
 if(!isAdmin())return;adminContent.classList.remove("hidden");adminGate.innerHTML="";
 const ps=await api("properties?select=*&order=created_at.desc"),bs=await api("bookings?select=*,properties(name)&order=created_at.desc");
 const revenue=bs.reduce((a,b)=>a+Number(b.total_amount||0),0),comm=bs.reduce((a,b)=>a+Number(b.commission_amount||0),0),pending=ps.filter(p=>p.approval_status==="pending").length;
 adminStats.innerHTML=`<div class="card"><div class="stat">${ps.length}</div><div class="muted">Properties</div></div><div class="card"><div class="stat">${bs.length}</div><div class="muted">Bookings</div></div><div class="card"><div class="stat">R${revenue.toFixed(2)}</div><div class="muted">Booking value</div></div><div class="card"><div class="stat">R${comm.toFixed(2)}</div><div class="muted">NALA commission</div></div>`;
 adminProperties.innerHTML=ps.length?ps.map(p=>`<div class="card" style="margin:8px 0"><b>${esc(p.name)}</b> · ${esc(p.city)} · R${Number(p.price).toFixed(2)} · <span class="pill">${esc(p.approval_status)}</span><p>${esc(p.owner_email||"")}</p>${p.approval_status==="pending"?`<button class="gold" onclick="approveProperty('${p.id}')">Approve</button> <button class="danger" onclick="rejectProperty('${p.id}')">Reject</button>`:""}</div>`).join(""):"No properties.";
 adminBookings.innerHTML=bs.length?`<table><tr><th>Ref</th><th>Property</th><th>Total</th><th>NALA</th><th>Partner</th><th>Status</th></tr>${bs.map(b=>`<tr><td>${esc(b.booking_ref)}</td><td>${esc(b.properties?.name||"")}</td><td>R${Number(b.total_amount).toFixed(2)}</td><td>R${Number(b.commission_amount).toFixed(2)}</td><td>R${Number(b.partner_amount).toFixed(2)}</td><td>${esc(b.status)}</td></tr>`).join("")}</table>`:"No bookings.";
}
async function approveProperty(id){await api("properties?id=eq."+id,{method:"PATCH",body:JSON.stringify({approval_status:"approved",active:true})});await loadAdmin();await loadProperties()}
async function rejectProperty(id){await api("properties?id=eq."+id,{method:"PATCH",body:JSON.stringify({approval_status:"rejected",active:false})});await loadAdmin()}

async function loadAI(){
 if(!isAdmin())return;aiContent.classList.remove("hidden");aiGate.innerHTML="";
 tasks=await api("ai_tasks?select=*&order=created_at.desc");const pending=tasks.filter(t=>t.status==="pending").length;
 aiStats.innerHTML=`<b>${pending}</b> pending decisions · <b>${tasks.length}</b> total operations tasks. <p class="muted">NALA AI V1 is an operations engine: it creates and prioritizes tasks automatically; you make the final business decisions.</p>`;
 tasksDiv();
}
function tasksDiv(){tasksEl();}
async function tasksEl(){
 const e=document.getElementById("tasks");e.innerHTML=tasks.length?tasks.map(t=>`<div class="card" style="margin:8px 0"><b>${esc(t.title)}</b><span class="pill">${esc(t.priority)}</span><p>${esc(t.body)}</p><b>${esc(t.status)}</b>${t.status==="pending"?`<p><button class="gold" onclick="resolveTask('${t.id}','approved')">Approve</button> <button class="danger" onclick="resolveTask('${t.id}','rejected')">Reject</button></p>`:""}</div>`).join(""):"<div class='card'>No tasks.</div>"}
async function resolveTask(id,s){await api("ai_tasks?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:s,resolved_at:new Date().toISOString()})});await loadAI()}

refreshUser().then(start);
</script></body></html>
